{#- Colour theme dropdown and the light/dark toggle, shared by every page.
    The sun and moon are drawn inline (outline icons in the style of Feather, MIT) so they follow the theme colour. -#}
{% if palettes|length > 1 %}
<select id="paletteSelect" class="nav-select palette-select" title="Colour theme" aria-label="Colour theme">
    {% for p in palettes %}<option value="{{ p.value }}"{% if p.value == default_palette %} selected{% endif %}>{{ p.label }}</option>{% endfor %}
</select>
{% endif %}
{% if cfg.theme.allow_user_toggle %}
<button id="themeToggle" class="theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>
{% endif %}
