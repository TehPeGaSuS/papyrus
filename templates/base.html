<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="site-name" content="{{ cfg.site.name }}">
    <title>{% block title %}{{ cfg.site.name }}{% endblock %}</title>
    <script nonce="{{ csp_nonce }}">
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches))
                document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <link id="prism-light" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
        rel="stylesheet"
        integrity="sha512-tN7Ec6zAFaVSG3TpNAKtk4DOHNpSwKHxxrsiw4GHKESGPs5njn/0sMCUMl2svV4wo4BK/rCP7juYz+zx+l6oeQ=="
        crossorigin="anonymous">
    <link id="prism-dark" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
        rel="stylesheet"
        integrity="sha512-vswe+cgvic/XBoF1OcM/TeJ2FW0OofqAVdCZiEYkd6dwGXthvkSFWOoGGJgS2CW70VK5dQM5Oh+7ne47s74VTg=="
        crossorigin="anonymous" disabled>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css"
        rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="{{ url_for('index') }}" class="brand">{{ cfg.site.name }}</a>
            <div class="nav-links">
                {% block nav_actions %}
                <a href="{{ url_for('index') }}" class="nav-btn">New</a>
                {% if cfg.theme.allow_user_toggle %}
                <button id="themeToggle" class="theme-toggle">🌙</button>
                {% endif %}
                {% endblock %}
            </div>
        </div>
    </nav>

    <main class="{% block main_class %}page-container{% endblock %}">
        {% block content %}{% endblock %}
    </main>
