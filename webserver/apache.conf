# Papyrus behind Apache httpd 2.4.
# Needs: a2enmod proxy proxy_http headers   (add remoteip when behind Cloudflare)
#
# Start with this plain HTTP vhost, then let certbot add TLS and the HTTP -> HTTPS redirect:
#     sudo certbot --apache -d paste.example.com
# certbot copies this vhost into a new port-443 one (with the certificate lines) and adds the
# redirect to this one, so don't write those by hand. Every directive below is therefore valid in
# both vhosts, which is why X-Forwarded-Proto uses the request's actual scheme instead of "https".
#
# Papyrus listens on 127.0.0.1:5500 and trusts X-Forwarded-For / X-Forwarded-Proto from a proxy
# on the same machine. mod_proxy adds X-Forwarded-For itself (the visitor's address is the last
# entry, which is the one Papyrus uses); X-Forwarded-Proto has to be set by hand.

<VirtualHost *:80>
    ServerName paste.example.com

    # Behind Cloudflare? Uncomment so the visitor's address replaces the Cloudflare one
    # (see cloudflare.md for how to create the include file):
    # RemoteIPHeader CF-Connecting-IP
    # Include /etc/apache2/cloudflare-remoteip.conf

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:5500/
    ProxyPassReverse / http://127.0.0.1:5500/
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    # pastes.max_size_bytes is 2 MB by default; leave headroom for the JSON wrapper.
    LimitRequestBody 3145728
</VirtualHost>
