# Papyrus behind nginx.  Copy to /etc/nginx/conf.d/papyrus.conf (or sites-available) and adjust.
#
# Start with this plain HTTP server block, then let certbot add TLS and the HTTP -> HTTPS redirect:
#     sudo certbot --nginx -d paste.example.com
# certbot edits this block (adds "listen 443 ssl" and the certificate paths) and creates the port-80
# redirect itself, so don't write those by hand. Keep the location block as it is: with
# "$scheme" it reports https once certbot has switched the block to TLS.
#
# Papyrus listens on 127.0.0.1:5500 (server.host / server.port in config.json) and trusts
# X-Forwarded-For / X-Forwarded-Proto from a proxy on the same machine. nginx must SET both
# headers (not pass through whatever the visitor sent).

server {
    listen 80;
    server_name paste.example.com;

    # pastes.max_size_bytes is 2 MB by default; leave headroom for the JSON wrapper.
    client_max_body_size 3m;

    # Behind Cloudflare? Uncomment (see cloudflare.md for how to create this file) so that
    # $remote_addr below is the visitor and not a Cloudflare address:
    # include /etc/nginx/cloudflare-realip.conf;

    location / {
        proxy_pass http://127.0.0.1:5500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;     # set, not appended: Papyrus reads the last entry
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
