[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrus"
version = "0.1.0"
description = "A self-hosted pastebin with threaded Markdown discussions and an admin panel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=23",
    "mistune>=3.1,<4",
    "nh3>=0.3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
papyrus = "app:main"

# Papyrus is a single module that runs from its own directory (templates, static files and
# config.json live next to app.py), so it is installed in editable mode: `pip install -e .`
[tool.setuptools]
py-modules = ["app"]
