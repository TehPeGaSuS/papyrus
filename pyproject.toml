[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrus"
dynamic = ["version"]
description = "A self-hosted pastebin with threaded Markdown comments and an admin panel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=23",
    "mistune>=3.1,<4",
    "nh3>=0.3",
]

[project.urls]
Source = "https://github.com/TehPeGaSuS/papyrus"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
papyrus = "app:main"

# Papyrus is a single module that runs from its own directory (templates, static files and
# config.json live next to app.py), so it is installed in editable mode: `pip install -e .`
[tool.setuptools]
py-modules = ["app"]

# The version is read from app.py (__version__ = "x.y.z") without importing it.
[tool.setuptools.dynamic]
version = { attr = "app.__version__" }
